<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brukshundstävlingar</title>
<style>
  body{font:16px/1.4 system-ui,sans-serif;margin:0 auto;max-width:40rem;padding:1rem}
  select,input{font:inherit;width:100%;padding:.5rem;margin:.25rem 0 .75rem;box-sizing:border-box}
  li{padding:.35rem 0;border-bottom:1px solid #8884}
  ul{list-style:none;padding:0}
  .liten{color:#888;font-size:.85rem}
</style>
</head>
<body>
<h1>Brukshundstävlingar</h1>
<p id="status" class="liten">Laddar…</p>
<select id="typ"><option value="">Alla typer</option></select>
<select id="distrikt"><option value="">Alla distrikt</option></select>
<input id="sok" type="search" placeholder="Sök klubb eller tävling">
<h2>Tävlingar</h2>
<ul id="tavlingar"></ul>
<h2>Klubbar</h2>
<ul id="klubbar"></ul>
<script>
const $ = id => document.getElementById(id);
let klubbar = [], tavlingar = [];
const STATUS = {opened: "anmälan öppen", closed: "anmälan stängd", late: "efteranmälan", published: "ej öppnad"};
function rita() {
  const d = $("distrikt").value, q = $("sok").value.toLowerCase(), ty = $("typ").value;
  const ok = x => (!d || x.distrikt === d) && (!ty || x.typ === ty) &&
    (!q || Object.values(x).join(" ").toLowerCase().includes(q));
  $("tavlingar").innerHTML = tavlingar.filter(ok).map(t =>
    `<li><b>${t.datum}</b> ${t.typ} – ${t.klubb} <span class="liten">${t.distrikt} · ${STATUS[t.status] || t.status}</span></li>`).join("") ||
    "<li class='liten'>Inga tävlingar inlästa än.</li>";
  $("klubbar").innerHTML = klubbar.filter(x => !ty && ok(x)).map(k =>
    `<li>${k.namn} <span class="liten">${k.distrikt}</span></li>`).join("");
}
Promise.all([
  fetch("data/klubbar.json").then(r => r.json()),
  fetch("data/tavlingar.json").then(r => r.json()),
]).then(([k, t]) => {
  klubbar = k; tavlingar = t.tavlingar;
  [...new Set(k.map(x => x.distrikt))].sort((a, b) => a.localeCompare(b, "sv"))
    .forEach(n => $("distrikt").add(new Option(n, n)));
  [...new Set(t.tavlingar.map(x => x.typ).filter(Boolean))].sort((a, b) => a.localeCompare(b, "sv"))
    .forEach(n => $("typ").add(new Option(n, n)));
  $("status").textContent = `${k.length} klubbar. Tävlingar uppdaterade: ${t.uppdaterad || "aldrig"}`;
  rita();
});
$("typ").onchange = $("distrikt").onchange = $("sok").oninput = rita;
</script>
</body>
</html>
